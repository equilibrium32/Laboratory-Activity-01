<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>
</head>
<body>

    {% if student %}
        <h1>Edit Student</h1>
    {% else %}
        <h1>Register Student</h1>
    {% endif %}

    <form method="post">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Save
        </button>

    </form>

    <br>

    <a href="{% url 'student_list' %}">
        Back to Student List
    </a>

</body>
</html>
